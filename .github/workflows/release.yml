name: Test and publish native release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test native package and patch generation
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s native/tests -v
      - name: Build and publish native source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_native_release.py
