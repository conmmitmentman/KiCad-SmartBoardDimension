[package]
name = "smartboard-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Japanese Rust launcher and per-user installer for SmartBoardDimension"

[dependencies]
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "=3.23.0"
